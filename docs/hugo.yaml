baseURL: "https://jkawamoto.github.io/go-pixeldrain/"
title: "go-pixeldrain"

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/jkawamoto/go-pixeldrain"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/pd.png
      width: 24
      height: 24
  footer:
    displayCopyright: true
    displayPoweredBy: true
  editURL:
    enable: true
    base: "https://github.com/jkawamoto/go-pixeldrain/edit/main/docs/content"
